# Ruff configuration for guild T8 and Fabric-exported notebooks.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Fabric exports notebook cells into a single .py file.
# An import in a later cell is legitimate.
"fabric/**/notebook-content.py" = ["E402"]
