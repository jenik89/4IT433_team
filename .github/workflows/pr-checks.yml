name: T8 - PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff - Python a notebooky
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.6

      - name: Lint Python and Jupyter notebooks
        run: ruff check .

  gitleaks:
    name: Gitleaks - tajne udaje
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pouzivame oficialni Gitleaks CLI v Dockeru (bez licence pro Gitleaks Action).
      # Scan cele historie zabrani prehlizeni tajnych udaju ve starsich commitech.
      - name: Scan secrets in Git history
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner .
